<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teltonika AVL Tracker Simulator Panel</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Custom styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-layout">
        <!-- Main Workspace: Map & Active tracker terminals -->
        <section class="main-workspace">
            <div class="panel-section map-container">
                <h2>LIVE GPS MAP</h2>
                <div id="map"></div>
            </div>

            <div class="panel-section trackers-monitor">
                <div class="monitor-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">TRACKER TERMINALS (<span id="active-count">0</span> ACTIVE)</h2>
                    
                    <!-- Search, filter and Layout toggles -->
                    <div class="filter-controls" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <input type="text" id="search-filter" placeholder="Filter IMEI..." style="width: 150px; padding: 6px 8px; font-size: 11px;">
                        
                        <div class="btn-group" style="gap: 4px;">
                            <button class="btn btn-outline btn-sm filter-btn active" data-filter="all">ALL</button>
                            <button class="btn btn-outline btn-sm filter-btn" data-filter="running">RUNNING</button>
                            <button class="btn btn-outline btn-sm filter-btn" data-filter="stopped">STOPPED</button>
                        </div>

                        <div class="btn-group" style="gap: 4px; margin-left: 8px;">
                            <button id="btn-layout-grid" class="btn btn-outline btn-sm" title="Grid View">GRID</button>
                            <button id="btn-layout-list" class="btn btn-outline btn-sm active" title="List View">LIST</button>
                        </div>
                    </div>
                </div>
                <div id="tracker-cards-grid" class="cards-grid list-view">
                    <!-- Cards injected dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Visual Workflow Designer Dialog Modal -->
    <div id="workflow-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>VISUAL WORKFLOW DESIGNER (ELSA BUILDER)</h2>
                <button id="btn-close-modal" class="btn btn-outline btn-sm">CLOSE</button>
            </div>
            <div class="modal-body workflow-designer-body">
                <!-- Toolbar for adding nodes -->
                <div class="designer-toolbar">
                    <button class="btn btn-outline btn-sm tool-node" data-type="ignition-on">IGNITION ON</button>
                    <button class="btn btn-outline btn-sm tool-node" data-type="ignition-off">IGNITION OFF</button>
                    <button class="btn btn-outline btn-sm tool-node" data-type="delay">DELAY SECONDS</button>
                    <button class="btn btn-outline btn-sm tool-node" data-type="drive">DRIVE PATH</button>
                </div>
                <!-- Interactive Node board workspace -->
                <div class="designer-board-container">
                    <div id="designer-board" class="designer-board">
                        <!-- Visual nodes injected dynamically -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-apply-workflow" class="btn btn-primary">APPLY WORKFLOW TO QUEUE</button>
            </div>
        </div>
    </div>

    <!-- GPS Picker Modal for Visual Designer -->
    <div id="gps-picker-modal" class="modal-overlay" style="z-index: 11000;">
        <div class="modal-content" style="width: 50vw; height: 60vh; max-width: 800px; max-height: 600px;">
            <div class="modal-header">
                <h2>SELECT GPS TARGET COORDINATE</h2>
                <button id="btn-close-gps-modal" class="btn btn-outline btn-sm">CANCEL</button>
            </div>
            <div class="modal-body" style="padding: 0; position: relative;">
                <div id="gps-picker-map" style="width: 100%; height: 100%; min-height: 300px;"></div>
            </div>
            <div class="modal-footer" style="padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;">
                <span id="gps-picker-coords" style="font-size: 11px; color: var(--text-muted); font-family: monospace;">Click on map to select coordinates</span>
                <button id="btn-confirm-gps" class="btn btn-primary btn-sm" disabled>CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- Wizard Step 1: Provision Tracker Modal -->
    <div id="wizard-step1-modal" class="modal-overlay" style="z-index: 10050;">
        <div class="modal-content" style="width: 400px; height: auto; max-height: 85vh;">
            <div class="modal-header">
                <h2>PROVISION NEW TRACKER (STEP 1 OF 2)</h2>
                <button id="btn-close-wizard" class="btn btn-outline btn-sm">CLOSE</button>
            </div>
            <div class="modal-body" style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group" style="display:flex; flex-direction:column; gap:6px;">
                    <label for="new-imei" style="font-size:10px; color:var(--text-muted);">IMEI NUMBER</label>
                    <div class="input-action-group" style="display: flex; gap: 6px;">
                        <input type="text" id="new-imei" placeholder="353344000000001" maxlength="15">
                        <button id="btn-rand-imei" class="btn btn-outline" style="padding: 8px 10px;">RAND</button>
                    </div>
                </div>
                <div class="form-group" style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-size:10px; color:var(--text-muted);">INITIAL LOCATION</label>
                    <div class="coord-inputs" style="display: flex; align-items: center; gap: 6px;">
                        <input type="number" id="init-lat" placeholder="Lat" step="0.0001" value="56.2084" style="flex: 1;">
                        <input type="number" id="init-lng" placeholder="Lng" step="0.0001" value="10.0359" style="flex: 1;">
                        <button id="btn-pick-init" class="btn btn-outline btn-picker" title="Pick from Map">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 2v4M12 18v4M4 12h4M16 12h4"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="padding: 12px 16px;">
                <button id="btn-wizard-next" class="btn btn-primary" style="width: 100%;">NEXT: DESIGN SEQUENCE</button>
            </div>
        </div>
    </div>

    <!-- Floating Action Button (FAB) -->
    <button id="btn-fab-add" class="fab-btn" title="Add Tracker">+</button>

    <script src="app.js"></script>
</body>
</html>
